<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-Hans' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {%- feed_meta -%}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="site-tagline">{{ site.tagline }}</p>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">全部简报</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS 订阅</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>由 Claude 每日自动生成 · 数据源 GitHub Search API</p>
      <p>时区 {{ site.timezone }} · 每天 09:00 / 15:00 / 20:00 更新</p>
    </div>
  </footer>
</body>
</html>
